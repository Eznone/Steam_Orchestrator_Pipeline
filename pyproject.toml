[project]
name = "deadlock-auto-clipper"
version = "0.1.0"
description = "Automated Deadlock replay clipper: parse .dem files, detect highlight events, and capture clips via OBS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boon-deadlock>=0.2.0",
    "flask>=3.1.3",
    "obsws-python>=1.8.0",
    "python-dotenv>=1.0.0",
    "polars>=1.41.2",
    "pyautogui>=0.9.54",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
deadlock-clipper = "deadlock_clipper.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
