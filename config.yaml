watcher:
  # Path to your Deadlock replays folder (Windows path, update USERNAME)
  hotfolder: 'C:\Program Files (x86)\Steam\steamapps\common\Deadlock\game\citadel\replays'
  processing_dir: "./data/processing"
  # Local .dem files surfaced in the UI file picker (development only)
  dev_replay_dir: "./tests/fixtures"

parser:
  output_dir: "./data/parsed"

analyzer:
  # Your Steam ID64 — leave blank to analyze all players
  target_player_steam_id: ""  # set via DEADLOCK_STEAM_ID in .env
  # POV to record for single-kill clips: "attacker" (the killer) or "victim" (the one killed).
  # Ignored for multikill/kill_streak (ambiguous — multiple distinct victims).
  pov: "attacker"
  # Seconds within which multiple kills count as a multi-kill
  multikill_window_seconds: 10
  # Ticks to record before the event trigger (lead-in context)
  clip_lead_ticks: 200
  # Ticks to record after the event ends (buffer)
  clip_buffer_ticks: 300
  # Minimum kill count to flag as a clip-worthy event
  multikill_threshold: 2
  # Minimum consecutive kills (without dying) for a kill streak clip
  kill_streak_threshold: 3
  # Objective types to detect for the "objective" event type
  objective_types:
    - walker
    - barracks
    - patron

recording:
  # Path to steam.exe (used to launch Deadlock with +playdemo)
  steam_exe: 'C:\Program Files (x86)\Steam\steam.exe'
  # Seconds to wait after launching before sending console commands
  launch_wait_seconds: 30
  # Seconds to wait after demo_goto before capture starts
  seek_settle_seconds: 2
  # Show the player HUD (health bars, ability icons) during clips.
  # Set to false to hide it via citadel_hud_visible. Independent of the replay
  # timeline (citadel_hide_replay_hud), which is always hidden.
  hud_visible: true

  # ── Capture settings (VidGear: ScreenGear + WriteGear) ────────────────
  # Target capture frame rate
  fps: 60
  # Video encoder: "gpu" (recommended — uses NVENC/QSV/AMF; auto-detects a
  # working hardware encoder; connect() raises an error if none is found) or
  # "cpu" (libx264 software fallback for machines without a GPU).
  encoder: "gpu"
  # Quality (lower = better; ignored when bitrate is set).
  # Applies to all encoders: libx264 (-crf), h264_nvenc (-cq), h264_qsv (-global_quality), h264_amf (-qvbr_quality_level).
  crf: 16
  # Encoder speed/quality tradeoff (ultrafast..veryslow)
  preset: "fast"
  # Optional constant bitrate, e.g. "8000k" — overrides crf when set
  bitrate: ""
  # Optional output scaling; leave at 0 to capture at the game window's native size
  output_width: 0
  output_height: 0

  # ── Audio capture ─────────────────────────────────────────────────────
  # Set to true to include system audio in clips via WASAPI loopback.
  # audio_device: leave blank to use the system default playback device
  # (speakers/headset). To target a specific device, paste its name from:
  #   python -c "import soundcard; print([m.name for m in soundcard.all_microphones(include_loopback=True)])"
  audio_capture: true
  audio_device: ""

clips:
  output_dir: "C:/Users/Eznone/Videos"

game_constants:
  kill_labels:
    2: "Double Kill"
    3: "Triple Kill"
    4: "Quad Kill"
    5: "Penta Kill"
  team_names:
    2: "Amber Hand"
    3: "Sapphire Flame"
  lane_names:
    1: "Yellow"
    4: "Blue"
    6: "Purple"
  objective_labels:
    walker: "Walker Destroyed"
    barracks: "Barracks Destroyed"
    shrine: "Shrine Destroyed"
    patron: "Patron Killed"
    mid_boss: "Mid Boss Killed"
